<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kanban Board</title>
    <link rel="stylesheet" href="B2.css">
</head>
<body>

<h1>Kanban Board</h1>

<div class="form-container">
    <input type="text" id="title" placeholder="Task Title">
    <textarea id="description" placeholder="Description"></textarea>

    <select id="priority">
        <option value="Low">Low</option>
        <option value="Medium">Medium</option>
        <option value="High">High</option>
    </select>

    <input type="date" id="dueDate">

    <button onclick="addCard()">Add Task</button>
</div>

<div class="board">
    <div class="column" data-status="todo">
        <h2>To Do</h2>
        <div class="task-list" id="todo"></div>
    </div>

    <div class="column" data-status="progress">
        <h2>In Progress</h2>
        <div class="task-list" id="progress"></div>
    </div>

    <div class="column" data-status="done">
        <h2>Done</h2>
        <div class="task-list" id="done"></div>
    </div>
</div>

<script src="B2.js"></script>
</body>
</html>
