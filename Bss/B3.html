<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dynamic Employee Table</title>
    <link rel="stylesheet" href="B3.css">
</head>
<body>

    <h1>Employee Management Table</h1>

    <input
        type="text"
        id="search"
        placeholder="Search employees..."
    >

    <table>
        <thead>
            <tr>
                <th onclick="sortTable('id')">ID</th>
                <th onclick="sortTable('name')">Name</th>
                <th onclick="sortTable('department')">Department</th>
                <th onclick="sortTable('salary')">Salary</th>
                <th>Actions</th>
            </tr>
        </thead>

        <tbody id="tableBody"></tbody>
    </table>

    <div class="pagination">
        <button onclick="prevPage()">Previous</button>
        <span id="pageInfo"></span>
        <button onclick="nextPage()">Next</button>
    </div>

    <script src="B3.js"></script>
</body>
</html>
